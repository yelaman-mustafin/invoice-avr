<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счёт и АВР</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#16181B; --muted:#6A707A; --line:#E2E5E9; --field:#F6F7F8;
  --acc:#1E5C49; --acc-ink:#FFFFFF; --acc-soft:#E4EFEA; --warn:#B4432A;
  --r:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121416; --surface:#1B1E21; --ink:#ECEEF0; --muted:#98A0A9; --line:#2C3136; --field:#22262A; --acc:#6CC5A6; --acc-ink:#0D1F19; --acc-soft:#1E3129; --warn:#F09A82; }
}
:root[data-theme="dark"]{ --bg:#121416; --surface:#1B1E21; --ink:#ECEEF0; --muted:#98A0A9; --line:#2C3136; --field:#22262A; --acc:#6CC5A6; --acc-ink:#0D1F19; --acc-soft:#1E3129; --warn:#F09A82; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding:14px 14px 110px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:960px){ .app{grid-template-columns:440px minmax(0,1fr);gap:24px;padding:22px 24px 40px} }

.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.req-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.req-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.req-btn.missing .dot{background:var(--warn)}

.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px #0002}

.row{display:grid;gap:8px}
.r2{grid-template-columns:1fr 1fr}
.r-num{grid-template-columns:96px 1fr}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f span{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;line-height:1.3}
@media (min-width:960px){ .f input,.f select,.f textarea{font-size:15px} }
.f textarea{resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc);outline:none;background:var(--surface)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--ink)}
.chip.new{color:var(--acc);border-style:dashed}

.item{border-top:1px solid var(--line);padding:10px 0 2px}
.item:first-of-type{border-top:0;padding-top:0}
.item-head{display:flex;gap:6px;align-items:start}
.item-head .f{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:38px;flex:none}
.x:hover{color:var(--warn)}
.item-nums{display:grid;grid-template-columns:70px 84px 1fr;gap:8px;margin-top:6px}
.item-sum{font-size:13px;color:var(--muted);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.add{margin-top:8px;width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;color:var(--acc);font-weight:500}

details.more>summary{list-style:none;cursor:pointer;font-size:14px;color:var(--acc);font-weight:500}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more[open]>summary{margin-bottom:8px}

/* preview */
.pv{min-width:0}
.pv-inner{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
.sheet{background:#fff;border-radius:4px;box-shadow:0 1px 2px #0000001a,0 10px 30px -18px #0006;overflow:hidden}
.sheet canvas{display:block;width:100%;height:auto}
.pv-msg{font-size:13px;color:var(--muted);padding:6px 2px}
.pv-desk-actions{display:none}
@media (min-width:960px){
  .pv-desk-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pv-desk-actions .total{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .pv-desk-actions .words{font-size:12px;color:var(--muted)}
  .pv-scroll{max-height:calc(100vh - 120px);overflow:auto;border-radius:4px}
}
@media (max-width:959px){
  .pv-inner{position:static}
}

/* bottom bar (mobile) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .total{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .lbl{font-size:12px;color:var(--muted)}
@media (min-width:960px){ .bar{display:none} }
.dl{border:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:12px 18px;font-weight:600;white-space:nowrap}
.dl:active{transform:translateY(1px)}
.dl[disabled]{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 28px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (min-width:960px){ .toast{bottom:28px} }

.banner{background:var(--acc-soft);border:1px solid var(--acc);border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner button{border:0;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:7px 12px;font-weight:600;flex:none}

/* settings dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:16px;width:min(560px,100%);max-height:min(92vh,900px)}
dialog::backdrop{background:#0008}
@media (max-width:600px){ dialog{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0} }
.dlg{display:flex;flex-direction:column;height:100%;max-height:inherit}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:17px}
.dlg-b{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500}
.group-t{font-size:13px;font-weight:600;color:var(--muted);margin:6px 0 -4px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mark{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:var(--muted);min-height:118px;justify-content:center;position:relative}
.mark img{max-width:100%;max-height:70px}
.mark input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mark .rm{position:relative;z-index:1;border:0;background:none;color:var(--warn);font-size:12px;padding:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Счёт и АВР</h1>
    <button type="button" class="req-btn" id="openReq"><span class="dot"></span>Мои реквизиты</button>
  </header>

  <div class="col" id="formCol">
    <div class="banner" id="firstRun" hidden>
      <span>Сначала заполните свои реквизиты — один раз.</span>
      <button type="button" id="firstRunBtn">Заполнить</button>
    </div>

    <div class="seg" role="group" aria-label="Документ">
      <button type="button" data-doc="invoice" aria-pressed="true">Счёт</button>
      <button type="button" data-doc="avr" aria-pressed="false">АВР</button>
      <button type="button" data-doc="both" aria-pressed="false">Оба</button>
    </div>

    <div class="card">
      <div class="row r-num">
        <label class="f"><span>Номер</span><input id="number" inputmode="numeric"></label>
        <label class="f"><span>Дата</span><input id="date" type="date"></label>
      </div>
    </div>

    <div class="card">
      <h2>Покупатель</h2>
      <div class="chips" id="buyerChips"></div>
      <div class="row">
        <label class="f"><span>Наименование</span><input id="b_name" placeholder='ТОО "Компания"' autocomplete="off"></label>
        <div class="row r2">
          <label class="f"><span>БИН / ИИН</span><input id="b_bin" inputmode="numeric" maxlength="12" autocomplete="off"></label>
          <label class="f"><span>Договор</span><input id="contract" placeholder="Без договора" autocomplete="off"></label>
        </div>
        <label class="f"><span>Адрес</span><input id="b_address" autocomplete="off"></label>
      </div>
    </div>

    <div class="card">
      <h2>Услуги</h2>
      <div id="items"></div>
      <button type="button" class="add" id="addItem">+ Добавить строку</button>
      <div class="chips" id="svcChips" style="margin:8px 0 0" hidden></div>
    </div>

    <div class="card" id="avrCard" hidden>
      <details class="more">
        <summary>Детали для АВР</summary>
        <div class="row">
          <label class="f"><span>Дата оказания услуг (если отличается)</span><input id="avrPerformed" placeholder="напр. 01.09.2026–30.09.2026"></label>
          <div class="row r2">
            <label class="f"><span>Заказчик: должность</span><input id="buyerSignerTitle" placeholder="Директор"></label>
            <label class="f"><span>Заказчик: ФИО</span><input id="buyerSigner" placeholder="Фамилия И.О."></label>
          </div>
        </div>
      </details>
    </div>
  </div>

  <section class="pv" id="pv">
    <div class="pv-inner">
      <div class="pv-desk-actions">
        <div><div class="total" id="deskTotal">0 ₸</div><div class="words" id="deskWords"></div></div>
        <button type="button" class="dl" id="dlDesk">Скачать PDF</button>
      </div>
      <div class="pv-scroll" id="pvScroll">
        <div class="col" id="sheets"></div>
        <div class="pv-msg" id="pvMsg"></div>
      </div>
    </div>
  </section>
</div>

<div class="bar">
  <div class="sum"><div class="lbl" id="barLbl">К оплате</div><div class="total" id="barTotal">0 ₸</div></div>
  <button type="button" class="dl" id="dlMob">Скачать PDF</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="reqDlg" aria-labelledby="reqTitle">
  <form class="dlg" method="dialog" onsubmit="return false">
    <div class="dlg-h"><h2 id="reqTitle">Мои реквизиты</h2><button type="button" class="btn" id="reqClose">Закрыть</button></div>
    <div class="dlg-b">
      <div class="seg" role="group" aria-label="Форма">
        <button type="button" data-entity="ip" aria-pressed="true">ИП</button>
        <button type="button" data-entity="too" aria-pressed="false">ТОО</button>
      </div>
      <label class="f"><span>Наименование</span><input id="s_name" placeholder='Индивидуальный предприниматель "Название"'></label>
      <label class="f"><span id="binLbl">ИИН</span><input id="s_bin" inputmode="numeric" maxlength="12"></label>
      <label class="f"><span>Адрес</span><input id="s_address" placeholder="Республика Казахстан, г. Алматы, ..."></label>

      <p class="group-t">Банк</p>
      <label class="f"><span>ИИК (IBAN)</span><input id="s_iik" placeholder="KZ…" autocapitalize="characters"></label>
      <div class="row r2">
        <label class="f"><span>Банк</span><input id="s_bank" list="bankList" placeholder='АО "KASPI BANK"'></label>
        <label class="f"><span>БИК</span><input id="s_bik" autocapitalize="characters"></label>
      </div>
      <datalist id="bankList"></datalist>
      <div class="row r2">
        <label class="f"><span>Кбе</span><input id="s_kbe" inputmode="numeric" maxlength="2"></label>
        <label class="f"><span>КНП</span><input id="knp" inputmode="numeric" maxlength="3"></label>
      </div>

      <p class="group-t">Подпись</p>
      <div class="row r2">
        <label class="f"><span>ФИО подписанта</span><input id="signer" placeholder="Фамилия И.О."></label>
        <label class="f"><span>Должность (для АВР)</span><input id="signerTitle"></label>
      </div>
      <div class="marks">
        <div class="mark" id="stampBox"><img id="stampImg" alt="" hidden><span id="stampTxt">Печать<br>PNG или фото</span><input type="file" accept="image/*" id="stampFile" aria-label="Загрузить печать"><button type="button" class="rm" id="stampRm" hidden>Убрать</button></div>
        <div class="mark" id="sigBox"><img id="sigImg" alt="" hidden><span id="sigTxt">Подпись<br>PNG или фото</span><input type="file" accept="image/*" id="sigFile" aria-label="Загрузить подпись"><button type="button" class="rm" id="sigRm" hidden>Убрать</button></div>
      </div>
      <label class="check"><input type="checkbox" id="useMarks"> Ставить печать и подпись в PDF</label>

      <p class="group-t">Налоги и текст</p>
      <label class="check"><input type="checkbox" id="vat"> Плательщик НДС <input type="text" inputmode="decimal" id="vatRate" style="width:64px;margin-left:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--field)">%</label>
      <label class="check"><input type="checkbox" id="showNotice"> Текст «Внимание!» в шапке счёта</label>
      <label class="f"><textarea id="notice" rows="3"></textarea></label>
    </div>
    <div class="dlg-f"><button type="button" class="dl" id="reqSave">Сохранить</button></div>
  </form>
</dialog>

<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js">

<script>
// ===== core v2 =====
// parse "19 000,50" / "19000.5" etc.
function toNum(v) { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[\s\u00a0]/g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; }
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDateLong(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS_GEN[m - 1]} ${y} г.`; }
function fmtDateShort(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }
function fmtDateQuoted(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `«${d}» ${MONTHS_GEN[m - 1]} ${y} г.`; }
// 1C-style numbers as in the original: 19,000.00 / 1.000
function money(n) { const v = Math.round((Number(n) || 0) * 100) / 100; const [i, f] = Math.abs(v).toFixed(2).split('.'); return (v < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + f; }
function qty3(n) { return (Number(n) || 0).toFixed(3); }
function moneyUi(n) { const v = Math.round((Number(n) || 0) * 100) / 100; const [i, f] = v.toFixed(2).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + (f === '00' ? '' : ',' + f); }

const ONES_M = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
const ONES_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
const TEENS = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
const TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
const HUNDREDS = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
function plural(n, f) { const a = n % 100, b = n % 10; if (a > 10 && a < 20) return f[2]; if (b === 1) return f[0]; if (b >= 2 && b <= 4) return f[1]; return f[2]; }
function triad(n, fem) { const o = [HUNDREDS[Math.floor(n / 100)]]; const t = n % 100; if (t >= 10 && t < 20) o.push(TEENS[t - 10]); else { o.push(TENS[Math.floor(t / 10)]); o.push((fem ? ONES_F : ONES_M)[t % 10]); } return o.filter(Boolean).join(' '); }
function intToWords(n) {
  if (n === 0) return 'ноль';
  const g = [[null, false], [['тысяча', 'тысячи', 'тысяч'], true], [['миллион', 'миллиона', 'миллионов'], false], [['миллиард', 'миллиарда', 'миллиардов'], false]];
  const p = []; let i = 0;
  while (n > 0 && i < g.length) { const x = n % 1000; if (x) { let s = triad(x, g[i][1]); if (g[i][0]) s += ' ' + plural(x, g[i][0]); p.unshift(s); } n = Math.floor(n / 1000); i++; }
  return p.join(' ');
}
function amountInWords(sum) { const v = Math.round((Number(sum) || 0) * 100); const w = intToWords(Math.floor(v / 100)); return w[0].toUpperCase() + w.slice(1) + ' тенге ' + String(v % 100).padStart(2, '0') + ' тиын'; }

function calcTotals(d) {
  const lines = d.items.map(it => { const q = toNum(it.qty), p = toNum(it.price); return { ...it, qty: q, price: p, sum: Math.round(q * p * 100) / 100 }; });
  const total = Math.round(lines.reduce((s, l) => s + l.sum, 0) * 100) / 100;
  const rate = d.vat ? toNum(d.vatRate) / 100 : 0;
  const vat = rate ? Math.round(total * rate / (1 + rate) * 100) / 100 : 0;
  return { lines, total, vat };
}

  const req = Object.assign({
    entity: 'ip', knp: '859', vat: false, vatRate: 16, showNotice: true, notice: DEFAULT_NOTICE,
    signer: '', signerTitle: 'ИП', useMarks: true, stamp: '', signature: '',
    seller: { name: '', bin: '', address: '', iik: '', bank: '', bik: '', kbe: '19' },
  }, savedReq || {});
  req.seller = Object.assign({ name: '', bin: '', address: '', iik: '', bank: '', bik: '', kbe: '19' }, req.seller || {});

  const draft = Object.assign({
    doc: 'invoice', number: '', date: today(), contract: '',
    buyer: { name: '', bin: '', address: '' },
    items: [{ code: '', name: '', qty: 1, unit: 'Услуга', price: '' }],
    avrPerformed: '', buyerSignerTitle: '', buyerSigner: '',
  }, LS.get('sa.draft', {}));
  draft.date = draft.date || today();
  if (!draft.number) draft.number = String(LS.get('sa.next', 1));
  let draftT; const saveDraft = () => { clearTimeout(draftT); draftT = setTimeout(() => LS.set('sa.draft', draft), 400); };

  // ---------- doc toggle ----------
  function setDoc(doc) {
    draft.doc = doc;
    document.querySelectorAll('[data-doc]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.doc === doc)));
    $('avrCard').hidden = doc === 'invoice';
    const lbl = doc === 'avr' ? 'Скачать АВР' : doc === 'both' ? 'Скачать оба' : 'Скачать счёт';
    $('dlMob').textContent = lbl; $('dlDesk').textContent = lbl + ' (PDF)';
    saveDraft(); schedule();
  }
  document.querySelectorAll('[data-doc]').forEach(b => b.addEventListener('click', () => setDoc(b.dataset.doc)));

  // ---------- simple fields ----------
  ['number', 'date', 'contract', 'avrPerformed', 'buyerSignerTitle', 'buyerSigner'].forEach(k => {
    const el = $(k); el.value = draft[k] || '';
    el.addEventListener('input', () => { draft[k] = el.value; saveDraft(); schedule(); });
  });
  ['name', 'bin', 'address'].forEach(k => {
    const el = $('b_' + k); el.value = draft.buyer[k] || '';
    el.addEventListener('input', () => { draft.buyer[k] = el.value; markChip(); saveDraft(); schedule(); });
  });

  // ---------- buyers ----------
  const buyers = () => LS.get('sa.buyers', []);
  // after a download the number stays (for the paired document); it advances when you start the next client
  let nextNumber = null;
  function advanceNumber() {
    if (nextNumber && draft.number !== String(nextNumber)) { draft.number = String(nextNumber); $('number').value = draft.number; }
    nextNumber = null;
  }
  function renderChips() {
    const list = buyers();
    const box = $('buyerChips');
    box.hidden = !list.length;
    box.innerHTML = list.map((b, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="false" title="${esc(b.bin)}">${esc(b.name)}</button>`).join('') +
      (list.length ? `<button type="button" class="chip new" data-new="1">+ Новый</button>` : '');
    box.querySelectorAll('[data-i]').forEach(c => c.addEventListener('click', () => {
      const b = list[+c.dataset.i];
      if (b.name !== draft.buyer.name) advanceNumber();
      draft.buyer = { name: b.name, bin: b.bin, address: b.address };
      if (b.contract !== undefined) { draft.contract = b.contract; $('contract').value = b.contract; }
      ['name', 'bin', 'address'].forEach(k => $('b_' + k).value = draft.buyer[k] || '');
      markChip(); saveDraft(); schedule();
    }));
    box.querySelector('[data-new]')?.addEventListener('click', () => {
      advanceNumber();
      draft.buyer = { name: '', bin: '', address: '' }; draft.contract = '';
      ['name', 'bin', 'address'].forEach(k => $('b_' + k).value = ''); $('contract').value = '';
      markChip(); saveDraft(); schedule(); $('b_name').focus();
    });
    markChip();
  }
  function markChip() {
    const list = buyers();
    $('buyerChips').querySelectorAll('[data-i]').forEach(c => {
      const b = list[+c.dataset.i];
      c.setAttribute('aria-pressed', String(b.name === draft.buyer.name && b.bin === draft.buyer.bin));
    });
  }
  function rememberBuyer() {
    if (!draft.buyer.name) return;
    const list = buyers().filter(b => !(b.name === draft.buyer.name || (draft.buyer.bin && b.bin === draft.buyer.bin)));
    list.unshift({ ...draft.buyer, contract: draft.contract || '' });
    LS.set('sa.buyers', list.slice(0, 30)); renderChips();
  }

  // ---------- services memory ----------
  const services = () => LS.get('sa.svc', []);
  function renderSvc() {
    const list = services().slice(0, 8), box = $('svcChips');
    box.hidden = !list.length;
    box.innerHTML = list.map((s, i) => `<button type="button" class="chip" data-s="${i}" title="${esc(moneyUi(s.price))} ₸">${esc(s.name)}</button>`).join('');
    box.querySelectorAll('[data-s]').forEach(c => c.addEventListener('click', () => {
      const s = list[+c.dataset.s];
      const empty = draft.items.find(i => !i.name && !toNum(i.price));
      const it = { code: s.code || '', name: s.name, qty: 1, unit: s.unit || 'Услуга', price: s.price };
      if (empty) Object.assign(empty, it); else draft.items.push(it);
      renderItems(); saveDraft(); schedule();
    }));
  }
  function rememberServices() {
    let list = services();
    draft.items.filter(i => i.name).forEach(i => {
      list = list.filter(s => s.name !== i.name);
      list.unshift({ name: i.name, unit: i.unit, price: i.price, code: i.code || '' });
    });
    LS.set('sa.svc', list.slice(0, 40)); renderSvc();
  }

  // ---------- items ----------
  function renderItems() {
    const box = $('items'); box.innerHTML = '';
    draft.items.forEach((it, i) => {
      const el = document.createElement('div'); el.className = 'item';
      el.innerHTML = `
        <div class="item-head">
          <label class="f"><span>Наименование</span><textarea data-k="name" rows="2" placeholder="Услуги по размещению рекламы">${esc(it.name)}</textarea></label>
          <button type="button" class="x" aria-label="Удалить строку ${i + 1}">×</button>
        </div>
        <div class="item-nums">
          <label class="f"><span>Кол-во</span><input data-k="qty" type="text" inputmode="decimal" autocomplete="off" value="${esc(it.qty)}"></label>
          <label class="f"><span>Ед.</span><input data-k="unit" value="${esc(it.unit)}"></label>
          <label class="f"><span>Цена, ₸</span><input data-k="price" type="text" inputmode="decimal" autocomplete="off" value="${esc(it.price)}"></label>
        </div>
        <div class="item-sum" data-sum></div>`;
      el.querySelectorAll('input,textarea').forEach(inp => inp.addEventListener('input', () => {
        if (inp.dataset.k === 'qty' || inp.dataset.k === 'price') {
          const clean = inp.value.replace(/[^\d\s.,]/g, '');
          if (clean !== inp.value) inp.value = clean;
        }
        it[inp.dataset.k] = inp.value;
        if (inp.dataset.k === 'name') {
          const hit = services().find(s => s.name === inp.value);
          if (hit) {
            if (!toNum(it.price)) { it.price = hit.price; el.querySelector('[data-k=price]').value = hit.price; }
            if (hit.unit) { it.unit = hit.unit; el.querySelector('[data-k=unit]').value = hit.unit; }
            if (hit.code) it.code = hit.code;
          }
        }
        updateSums(); saveDraft(); schedule();
      }));
      el.querySelector('.x').addEventListener('click', () => {
        if (draft.items.length === 1) draft.items[0] = { code: '', name: '', qty: 1, unit: 'Услуга', price: '' };
        else draft.items.splice(i, 1);
        renderItems(); saveDraft(); schedule();
      });
      box.appendChild(el);
    });
    updateSums();
  }
  $('addItem').addEventListener('click', () => {
    const last = draft.items[draft.items.length - 1];
    draft.items.push({ code: '', name: '', qty: 1, unit: last?.unit || 'Услуга', price: '' });
    renderItems(); saveDraft(); schedule();
    $('items').querySelector('.item:last-child textarea')?.focus();
  });

  function docData() {
    return {
      ...req, seller: { ...req.seller }, entity: req.entity,
      number: draft.number, date: draft.date, contract: draft.contract,
      buyer: { ...draft.buyer },
      items: draft.items.filter(i => i.name || toNum(i.price)),
      avrPerformed: draft.avrPerformed, buyerSignerTitle: draft.buyerSignerTitle, buyerSigner: draft.buyerSigner,
      avrNumber: draft.number, avrDate: draft.date,
    };
  }

  function updateSums() {
    $('items').querySelectorAll('.item').forEach((row, i) => {
      const it = draft.items[i]; const s = toNum(it.qty) * toNum(it.price);
      row.querySelector('[data-sum]').textContent = s ? `${moneyUi(s)} ₸` : '';
    });
    const t = calcTotals(docData());
    const txt = `${moneyUi(t.total)} ₸`;
    $('barTotal').textContent = txt; $('deskTotal').textContent = txt;
    $('deskWords').textContent = t.total ? amountInWords(t.total) : '';
    $('barLbl').textContent = req.vat ? `К оплате, в т.ч. НДС ${moneyUi(t.vat)} ₸` : 'К оплате';
  }

  // ---------- preview (real PDF rendered with pdf.js) ----------
  let timer = null, renderSeq = 0;
  function schedule() { updateSums(); clearTimeout(timer); timer = setTimeout(renderPreview, 300); }
  let lastKey = '';
  const pdfCache = new Map(); // def-json -> pdf bytes, avoids rebuilding unchanged documents in 'both' mode
  const pvOpen = () => true;
  function defsFor(doc, d) { return doc === 'both' ? [['invoice', buildInvoiceDoc(d)], ['avr', buildAvrDoc(d)]] : [[doc, doc === 'avr' ? buildAvrDoc(d) : buildInvoiceDoc(d)]]; }
  const toBuffer = (def) => new Promise((res, rej) => { try { pdfMake.createPdf(def).getBuffer(res); } catch (e) { rej(e); } });

  async function renderPreview() {
    if (!pvOpen()) return;
    const seq = ++renderSeq;
    if (!(await pdfMakeReady)) { $('pvMsg').textContent = 'Модуль PDF не загрузился — проверьте интернет и обновите страницу.'; return; }
    if (!(await pdfjsReady)) { $('pvMsg').textContent = 'Предпросмотр недоступен, но PDF скачивается.'; return; }
    if (seq !== renderSeq) return;
    try {
      const d = docData();
      const defs = defsFor(draft.doc, d);
      const box = $('sheets');
      const width = box.clientWidth || 600;
      const key = width + '|' + JSON.stringify(defs);
      if (key === lastKey) return;          // nothing visible changed — skip the whole render
      const canvases = [];
      for (const [, def] of defs) {
        const dk = JSON.stringify(def);
        let buf = pdfCache.get(dk);
        if (!buf) { buf = await toBuffer(def); if (pdfCache.size > 3) pdfCache.delete(pdfCache.keys().next().value); pdfCache.set(dk, buf); }
        if (seq !== renderSeq) return;
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf).slice(), disableFontFace: false, isEvalSupported: false }).promise;
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const scale = (width / base.width) * Math.min(window.devicePixelRatio || 1, 2);
          const vp = page.getViewport({ scale });
          const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          page.cleanup();
          if (seq !== renderSeq) { pdf.destroy(); return; }
          canvases.push(c);
        }
        pdf.destroy();                       // free parser memory after each render
      }
      box.innerHTML = '';
      canvases.forEach(c => { const s = document.createElement('div'); s.className = 'sheet'; s.appendChild(c); box.appendChild(s); });
      $('pvMsg').textContent = '';
      lastKey = key;
    } catch (e) {
      $('pvMsg').textContent = 'Предпросмотр не получился, но PDF скачивается. ' + (e?.message || '');
    }
  }
  let lastW = 0;
  window.addEventListener('resize', () => { const w = $('sheets').clientWidth; if (Math.abs(w - lastW) > 40) { lastW = w; schedule(); } });

  // ---------- requisites dialog ----------
  const dlg = $('reqDlg');
  const reqFields = { s_name: 'name', s_bin: 'bin', s_address: 'address', s_iik: 'iik', s_bank: 'bank', s_bik: 'bik', s_kbe: 'kbe' };
  function fillReq() {
    Object.entries(reqFields).forEach(([id, k]) => $(id).value = req.seller[k] || '');
    ['knp', 'signer', 'signerTitle', 'notice', 'vatRate'].forEach(k => $(k).value = req[k] ?? '');
    ['vat', 'showNotice', 'useMarks'].forEach(k => $(k).checked = !!req[k]);
    setEntityUI(req.entity); showMarks();
  }
  function setEntityUI(e) {
    document.querySelectorAll('[data-entity]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.entity === e)));
    $('binLbl').textContent = ENT[e].bin;
  }
  document.querySelectorAll('[data-entity]').forEach(b => b.addEventListener('click', () => {
    const prev = ENT[req.entity]; req.entity = b.dataset.entity; const next = ENT[req.entity];
    if (!$('s_kbe').value || $('s_kbe').value === prev.kbe) $('s_kbe').value = next.kbe;
    if (!$('signerTitle').value || $('signerTitle').value === prev.title) $('signerTitle').value = next.title;
    setEntityUI(req.entity);
  }));
  $('s_bank').addEventListener('input', () => { const hit = BANKS.find(b => b[0] === $('s_bank').value); if (hit) $('s_bik').value = hit[1]; });
  $('s_iik').addEventListener('input', () => {
    const v = $('s_iik').value.replace(/\s+/g, '').toUpperCase();
    if (/^KZ\d{2}722/.test(v) && !$('s_bank').value) { $('s_bank').value = 'АО "KASPI BANK"'; $('s_bik').value = 'CASPKZKA'; }
  });

  function readReq() {
    Object.entries(reqFields).forEach(([id, k]) => req.seller[k] = $(id).value.trim());
    req.seller.iik = req.seller.iik.replace(/\s+/g, '').toUpperCase();
    req.seller.bik = req.seller.bik.toUpperCase();
    ['knp', 'signer', 'signerTitle', 'notice'].forEach(k => req[k] = $(k).value);
    req.vatRate = toNum($('vatRate').value);
    ['vat', 'showNotice', 'useMarks'].forEach(k => req[k] = $(k).checked);
  }
  function reqMissing() { const s = req.seller; return !(s.name && s.bin && s.iik && s.bik && s.bank); }
  function refreshReqState() {
    $('openReq').classList.toggle('missing', reqMissing());
    $('firstRun').hidden = !reqMissing();
  }
  function openReq() { fillReq(); dlg.showModal ? dlg.showModal() : dlg.setAttribute('open', ''); }
  $('openReq').addEventListener('click', openReq);
  $('firstRunBtn').addEventListener('click', openReq);
  $('reqClose').addEventListener('click', () => dlg.close());
  $('reqSave').addEventListener('click', () => {
    readReq();
    const ok = LS.set('sa.req', req);
    dlg.close(); refreshReqState(); schedule();
    toast(ok ? 'Реквизиты сохранены' : 'Браузер не дал сохранить — после перезагрузки придётся ввести снова');
  });

  // stamp & signature: downscale, make white background transparent
  function loadMark(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = () => rej(new Error('read'));
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 500, k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
          const px = g.getImageData(0, 0, c.width, c.height); const a = px.data;
          for (let i = 0; i < a.length; i += 4) {
            const m = Math.min(a[i], a[i + 1], a[i + 2]);
            if (m > 225) a[i + 3] = 0; else if (m > 185) a[i + 3] = Math.min(a[i + 3], Math.round((225 - m) / 40 * 255));
          }
          g.putImageData(px, 0, 0); res(c.toDataURL('image/png'));
        };
        img.onerror = () => rej(new Error('img'));
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  function showMarks() {
    [['stamp', 'stampImg', 'stampTxt', 'stampRm'], ['signature', 'sigImg', 'sigTxt', 'sigRm']].forEach(([k, img, txt, rm]) => {
      $(img).hidden = !req[k]; if (req[k]) $(img).src = req[k];
      $(txt).hidden = !!req[k]; $(rm).hidden = !req[k];
    });
  }
  [['stampFile', 'stamp'], ['sigFile', 'signature']].forEach(([id, k]) => $(id).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { req[k] = await loadMark(f); $('useMarks').checked = true; showMarks(); } catch { toast('Не удалось прочитать картинку'); }
    e.target.value = '';
  }));
  $('stampRm').addEventListener('click', () => { req.stamp = ''; showMarks(); });
  $('sigRm').addEventListener('click', () => { req.signature = ''; showMarks(); });

  // ---------- download ----------
  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
  let downloads = null;
  (async () => { try { if (window.claude?.use) downloads = await window.claude.use('downloads'); } catch { downloads = null; } })();
  const safe = (x) => String(x || '').replace(/["«»\\/:*?<>|]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 50);

  async function download() {
    if (reqMissing()) { toast('Заполните свои реквизиты'); openReq(); return; }
    const d = docData();
    if (!d.buyer.name) { toast('Укажите покупателя'); $('b_name').focus(); return; }
    if (!d.items.length) { toast('Добавьте услугу с ценой'); return; }
    if (!(await pdfMakeReady)) { toast('Модуль PDF не загрузился, обновите страницу'); return; }
    const btns = [$('dlMob'), $('dlDesk')]; btns.forEach(b => b.disabled = true);
    try {
      for (const [kind, def] of defsFor(draft.doc, d)) {
        const name = `${kind === 'avr' ? 'АВР' : 'Счет на оплату'} № ${safe(d.number)} ${safe(d.buyer.name)}.pdf`;
        if (downloads) {
          const buf = pdfCache.get(JSON.stringify(def)) || await toBuffer(def);
          await downloads.save({ filename: name, data: new Blob([buf], { type: 'application/pdf' }) });
        } else {
          pdfMake.createPdf(def).download(name);
        }
      }
      rememberBuyer(); rememberServices();
      const n = parseInt(d.number, 10);
      if (!isNaN(n)) LS.set('sa.next', Math.max(n + 1, LS.get('sa.next', 1)));
      toast(isNaN(n) ? 'Готово' : `Готово. Следующий номер — ${n + 1}`);
      if (!isNaN(n)) nextNumber = n + 1;
    } catch (e) {
      if (e?.code === 'declined') toast('Сохранение отменено');
      else if (e?.code === 'rate_limited') toast('Окно сохранения уже открыто');
      else toast('Не получилось сохранить PDF');
    } finally { btns.forEach(b => b.disabled = false); }
  }
  $('dlMob').addEventListener('click', download);
  $('dlDesk').addEventListener('click', download);

  // ---------- init ----------
  renderChips(); renderSvc(); renderItems(); setDoc(draft.doc || 'invoice'); refreshReqState();
  if (reqMissing() && !savedReq) setTimeout(openReq, 300);
})();

</script>
</body>
</html>
